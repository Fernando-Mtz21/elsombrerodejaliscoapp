<div class="body pt-4">
 <div class="p-2">
   @for (item of this.faqs; track $index) {
<p-card styleClass="mx-2 mt-2 border-round-2xl shadow-2 overflow-hidden">
    <ng-template pTemplate="header">
      <img 
        src={{item.url_img}}
      />
    </ng-template>
    <div class="p-4">
      <h3 class="m-0 mb-2">{{ item.title }}</h3>
      <p class="m-0 text-600">
        {{ item.description }}
      </p>
    </div>
  </p-card>
  <br>
    }
  
</div>

</div>
