<div class="body">
  <div class="hh-card" (click)="goToMargaritas()" style="cursor: pointer;">
    <div class="hh-overlay"></div>
    <div class="hh-content">
      <div class="hh-timer-wrapper">
        <h1 class="hh-countdown">{{ timeForHH }}</h1>
        <h3 class="hh-subtext">{{ left }}</h3>
      </div>
    </div>
  </div>

  <div class="container my-4 px-3">
<div class="container my-4">
  <div class="d-flex flex-column gap-3 align-items-center">
    
<div routerLink="/Bookatable" routerLinkActive="active" class="skew-btn-wrapper shadow-sm cursor-pointer nav-item">
  <div class="skew-btn-content d-flex align-items-center justify-content-center">
    <span class="fw-bold fs-5 text-uppercase">Book a table</span>
  </div>
</div>
    
    <div class="skew-btn-wrapper shadow-sm cursor-pointer" (click)="goToBar()">
      <div class="skew-btn-content d-flex align-items-center justify-content-center">
        <span class="fw-bold fs-5 text-uppercase">Bar</span>
      </div>
    </div>
  </div>
</div>
</div>

  <p-carousel 
    [value]="images" 
    [numVisible]="1" 
    [numScroll]="1" 
    [circular]="true" 
    [showNavigators]="false" 
    [autoplayInterval]="5000">
    <ng-template pTemplate="item" let-image>
      <div class="image-container">
        <img [src]="image" alt="Imagen" class="background-image" />
      </div>
    </ng-template>
  </p-carousel>

  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1 class="title">{{ labels.message1 }}</h1>
      <p class="description">
        {{ labels.message2 }}
      </p>
    </div>
  </div>

<div class="row justify-content-center g-3 mt-2 px-3">
  @for (item of this.menu; track $index) {
    <div class="col-12">
      <div 
        class="custom-card p-4 text-white rounded-4 shadow-sm position-relative overflow-hidden cursor-pointer"
        (click)="this.seeProducts(item.categories)">
        <div class="card-bg-pattern"></div>
        <div class="card-content position-relative z-1">
        <h3 class="fw-bold mb-2 fs-1">{{ item.name }}</h3>
        <p class="fw-bold mb-2 fs-6">{{ item.description }}</p>
        </div>
      </div>
    </div>
  }
</div>

  <br>

  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1 class="title">{{ labels.message3 }}</h1>
      <p class="description">
        {{ labels.message4 }}
      </p>
      <button class="btn-primary">CALL US</button>
    </div>
  </div>
</div>
