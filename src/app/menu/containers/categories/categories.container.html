<div class="body pt-4">
  <div class="d-flex justify-content-start align-items-center w-100">
    <button class="left ms-3" (click)="this.goBack()">
      <i class="bi bi-arrow-left"></i>
    </button>
  </div>
  <div class="d-flex justify-content-center align-items-center row pb-6">
    @for (item of this.categories; track $index) {
    <div
      class="menu-containter col-12 m-2 p-1 d-flex justify-content-center align-items-center rounded"
      (click)="this.seeProduct(item.products)"
    >
      <h1>{{item.name}}</h1>
    </div>
    }
  </div>
</div>
