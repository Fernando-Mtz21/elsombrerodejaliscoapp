<div class="body pt-4">
  <div class="d-flex justify-content-start align-items-center w-100">
    <button class="left ms-3" (click)="this.goBack()">
      <i class="bi bi-arrow-left"></i>
    </button>
  </div>
<br>

<div class="product-card">
  <div class="info-banners">
    @for (item of categories; track item.id || $index) {
      @if (item.description?.trim()) {
        <div class="info-card">
          <div class="info-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <div class="info-content">
            <p class="info-text">{{ item.description }}</p>
          </div>
        </div>
      }
    }
  </div>
</div>

<div class="row justify-content-center g-3 mt-2 px-3">
  @for (item of this.categories; track $index) {
      <div class="col-12">
        <div 
          class="custom-card p-4 text-white rounded-4 shadow-sm position-relative overflow-hidden cursor-pointer"
          (click)="this.seeProduct(item.products)">
          
          <div class="card-bg-pattern"></div>
          
          <div class="card-content position-relative z-1">
            <h3 class="fw-bold mb-2 fs-1">{{ item.name }}</h3>
          </div>

        </div>
      </div>
  }
</div>


</div>
