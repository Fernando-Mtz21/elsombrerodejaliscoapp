@if (this.isLoading) {
<!-- Here code for spinner -->
<div class="content">
  <div class="loading-content">
    <div class="img-cont"></div>
    <!-- <img class="logo-spin" src="assets/img/logo.png" /> -->
    <p class="loading-text">Loading...</p>
  </div>
</div>
}
<div [ngClass]="{ 'd-none': this.isLoading }">
  <router-outlet></router-outlet>
</div>
